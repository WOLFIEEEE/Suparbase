# Suparbase — Coolify deployment
#
# Three services:
#   bootstrap  — runs ONCE on first deploy. Generates strong random secrets
#                into a shared docker volume (suparbase_secrets). On every
#                subsequent boot, it is a no-op: existing secrets are reused.
#   db         — supabase/postgres. Reads its password from the secrets volume
#                via POSTGRES_PASSWORD_FILE.
#   app        — this Next.js app. Reads AUTH_SECRET, SUPARBASE_ENCRYPTION_KEY,
#                and POSTGRES_PASSWORD from the volume via *_FILE env vars.
#                The entrypoint composes DATABASE_URL at runtime.
#
# Required env vars to type in Coolify: NONE.
# Operator-supplied env values always win over the auto-generated secrets.
#
# Optional env vars you'll likely want to set in Coolify:
#   AUTH_URL                — your public origin (defaults to https://suparbase.com)
#   AUTH_GITHUB_ID          — only if you want GitHub OAuth available
#   AUTH_GITHUB_SECRET      — only if you want GitHub OAuth available
#   SUPARBASE_AI_DEFAULT_MODEL  — default OpenRouter model for new users
#
# ⚠ Losing the `suparbase_secrets` volume destroys your encryption key
#   and every encrypted Supabase / OpenRouter credential stored in this
#   deploy. Use Coolify's volume snapshot feature.

services:
  bootstrap:
    image: alpine:3.20
    user: root
    restart: "no"
    volumes:
      - suparbase_secrets:/secrets
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "[bootstrap] starting (uid=$$(id -u))"
        mkdir -p /secrets
        # Dir traversable + readable by everyone so non-root containers
        # (postgres, nextjs) can read the files inside.
        chmod 755 /secrets
        # URL-safe printable token for passwords/secrets that end up in URLs
        # (postgres password becomes part of DATABASE_URL, so +/= are stripped).
        gen_token() {
          target="/secrets/$$1"
          if [ ! -s "$$target" ]; then
            head -c 32 /dev/urandom | base64 | tr -d '\n=+/' | head -c 44 > "$$target"
            echo "[bootstrap] generated $$target"
          else
            echo "[bootstrap] $$target already present"
          fi
          chmod 444 "$$target"
        }
        # Standard base64 of exactly 32 random bytes — must decode back to 32
        # bytes for AES-256-GCM. Do NOT strip padding/charset, that corrupts it.
        gen_b64key() {
          target="/secrets/$$1"
          if [ -s "$$target" ]; then
            n=$$(base64 -d < "$$target" 2>/dev/null | wc -c | tr -d ' ')
            if [ "$$n" = "32" ]; then
              echo "[bootstrap] $$target already present"
              chmod 444 "$$target"
              return 0
            fi
            echo "[bootstrap] $$target exists but decodes to $$n bytes (need 32); regenerating"
            # File may be 0444 from a prior run — re-allow write before overwriting.
            chmod 644 "$$target" || true
          fi
          head -c 32 /dev/urandom | base64 | tr -d '\n' > "$$target"
          echo "[bootstrap] generated $$target"
          chmod 444 "$$target"
        }
        gen_token postgres_password
        gen_token auth_secret
        gen_b64key encryption_key
        echo "[bootstrap] final listing of /secrets:"
        ls -la /secrets
        echo "[bootstrap] done"

  db:
    image: supabase/postgres:15.1.1.78
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: suparbase
    volumes:
      - suparbase_secrets:/run/secrets:ro
      - suparbase_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suparbase"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - suparbase_secrets:/secrets:ro
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Operator may override any of these in Coolify. When blank, the
      # entrypoint loads the corresponding *_FILE.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: suparbase

      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_SECRET_FILE: /secrets/auth_secret
      AUTH_URL: ${AUTH_URL:-https://suparbase.com}

      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}

      SUPARBASE_ENCRYPTION_KEY: ${SUPARBASE_ENCRYPTION_KEY:-}
      SUPARBASE_ENCRYPTION_KEY_FILE: /secrets/encryption_key
      SUPARBASE_ENCRYPTION_KEY_OLD: ${SUPARBASE_ENCRYPTION_KEY_OLD:-}

      SUPARBASE_AI_DEFAULT_MODEL: ${SUPARBASE_AI_DEFAULT_MODEL:-anthropic/claude-3.5-haiku}

      # Optional: transactional email via Resend. When both RESEND_API_KEY
      # and EMAIL_FROM are set, team invitations are emailed directly.
      # With either missing, the UI falls back to copy-link invites.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  suparbase_db_data:
  suparbase_secrets:
