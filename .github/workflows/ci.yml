name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    # Constitution-mandated pre-merge gates (see .specify/memory/constitution.md):
    #   1. `tsc --noEmit` passes with no errors.
    #   2. `next build` succeeds and bundle remains within budgets.
    # This job enforces gates 1 and 2 on every PR + every push to main.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        # `next build` collects page metadata at compile time, which means
        # every server module's top-level code runs. Several modules under
        # `src/server/` assert their env vars on load (db.ts, auth.ts,
        # vault.ts). We pass throw-away placeholder values so module
        # initialisation succeeds; no connections are opened (postgres-js
        # is lazy) and no real secrets are needed for the build itself.
        # See: src/server/db.ts, src/server/auth.ts, src/server/crypto/vault.ts.
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real
          AUTH_URL: http://localhost:3000
          # 32 bytes of base64 → AES-256-GCM keylength check passes.
          SUPARBASE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Show build summary
        if: always()
        run: |
          echo "::group::Route bundle sizes"
          # Surface the Route table from `next build` for at-a-glance review
          # of the Constitution Principle I budget (520 KB gz / authed route).
          if [ -f .next/build-manifest.json ]; then
            echo "next build manifest present"
          fi
          echo "::endgroup::"
