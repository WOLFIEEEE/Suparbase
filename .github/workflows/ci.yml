name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    # Constitution-mandated pre-merge gates (see .specify/memory/constitution.md):
    #   1. `tsc --noEmit` passes with no errors.
    #   2. `next build` succeeds and bundle remains within budgets.
    # This job enforces gates 1 and 2 on every PR + every push to main.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # Pure-function unit tests under tests/. The real-DB integration
        # tests are gated by the separate migrate-smoke job below.
        run: pnpm test

      - name: Build
        # `next build` collects page metadata at compile time, which means
        # every server module's top-level code runs. Several modules under
        # `src/server/` assert their env vars on load (db.ts, auth.ts,
        # vault.ts). We pass throw-away placeholder values so module
        # initialisation succeeds; no connections are opened (postgres-js
        # is lazy) and no real secrets are needed for the build itself.
        # See: src/server/db.ts, src/server/auth.ts, src/server/crypto/vault.ts.
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real
          AUTH_URL: http://localhost:3000
          # 32 bytes of base64 → AES-256-GCM keylength check passes.
          SUPARBASE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Show build summary
        if: always()
        run: |
          echo "::group::Route bundle sizes"
          # Surface the Route table from `next build` for at-a-glance review
          # of the Constitution Principle I budget (520 KB gz / authed route).
          if [ -f .next/build-manifest.json ]; then
            echo "next build manifest present"
          fi
          echo "::endgroup::"

  migrate-smoke:
    name: Migrations · fresh DB
    runs-on: ubuntu-latest
    # Validates every drizzle/00*.sql applies cleanly against an empty
    # Postgres 16. Catches schema-drift mistakes (typo in a new migration,
    # missing dependency on an existing column) before they reach Coolify's
    # pre-`next start` migrator and brick a deploy.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the migrator
        run: pnpm build:migrator

      - name: Apply migrations to fresh Postgres
        run: node dist/migrator.mjs
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      - name: Re-apply (idempotency check)
        # A second run must be a no-op - drizzle's migrator records every
        # applied migration in __drizzle_migrations and skips repeats.
        run: node dist/migrator.mjs
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
